name: CI Pipeline

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      PUBLIC_UMAMI_WEBSITE_ID:
        description: Public Umami website identifier embedded at build time
        required: true
      NEXT_PUBLIC_SPREE_ID:
        required: true
      NEXT_PUBLIC_RECAPTCHA_ID:
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Check project
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build project
        run: pnpm build
        env:
          PUBLIC_FORMSPREE_ID: ${{ secrets.NEXT_PUBLIC_SPREE_ID }}
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ID }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID }}

      - name: Run browser tests
        run: pnpm test:e2e
