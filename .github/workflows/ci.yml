name: CI Pipeline

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      NEXT_PUBLIC_SPREE_ID:
        required: true
      NEXT_PUBLIC_RECAPTCHA_ID:
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright
        run: yarn playwright install --with-deps chromium

      - name: Check project
        run: yarn run check

      - name: Run unit tests
        run: yarn test:unit

      - name: Build project
        run: yarn build
        env:
          PUBLIC_FORMSPREE_ID: ${{ secrets.NEXT_PUBLIC_SPREE_ID }}
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.NEXT_PUBLIC_RECAPTCHA_ID }}

      - name: Run browser tests
        run: yarn test:e2e
